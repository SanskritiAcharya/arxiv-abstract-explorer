[theme]
base = "light"
primaryColor = "#111827"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F6F7F9"
textColor = "#111827"
borderColor = "#E5E7EB"
showWidgetBorder = true
baseRadius = "medium"
font = "'Inter', sans-serif:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
codeFont = "'JetBrains Mono', monospace:https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap"

[client]
toolbarMode = "minimal"
showSidebarNavigation = false
